name: how_reliable_models_self_logs

# PostgreSQL for this project only. Image pinned; data in a named volume.
# Host port 55431 so the four projects' databases can run side by side.
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: hrsl
      POSTGRES_PASSWORD: hrsl
      POSTGRES_DB: how_reliable_models_self_logs
    ports:
      - "127.0.0.1:55431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsl -d how_reliable_models_self_logs"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
